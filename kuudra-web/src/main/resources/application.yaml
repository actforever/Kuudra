spring:
  application:
    name: kuudra-web
server:
  port: 8080

knife4j:
  enable: true
  setting:
    enable-group: true
    language: zh_cn
springdoc:
  api-docs:
    path: /v3/api-docs

  swagger-ui:
    path: /swagger-ui.html
    urls-primary-name: 00 - 全部接口
    tags-sorter: alpha
    operations-sorter: alpha
  group-configs:
    - group: all
      display-name: 00 - 全部接口
      paths-to-match:
        - /api/v1/**
      packages-to-scan: io.github.actforever.kuudra.web.controller
    - group: kuudra
      display-name: 01 - Kuudra 内核
      paths-to-match: /api/v1/kuudra/**
      packages-to-scan: io.github.actforever.kuudra.web.controller
    - group: runtime
      display-name: 02 - Runtime 运行资源
      paths-to-match: /api/v1/runtime/**
      packages-to-scan: io.github.actforever.kuudra.web.controller
    - group: plugin
      display-name: 03 - Plugin 扩展资源
      paths-to-match: /api/v1/plugin/**
      packages-to-scan: io.github.actforever.kuudra.web.controller
    - group: system-events
      display-name: 04 - 系统事件
      paths-to-match: /api/v1/system-events/**
      packages-to-scan: io.github.actforever.kuudra.web.controller
