# Kuudra 家目录。打包 Web 中相对路径以可执行 JAR 所在目录为基准。
home-directory: .kuudra

# 启动时是否显示 Banner。
banner-enabled: true

runtime:
  # Runtime 事件队列容量与工作线程数。
  queue-capacity: 1024
  worker-threads: 2
  # 单个事件允许经历的最大路由跳数。
  max-event-hops: 256
  dispatcher-poll-interval-ms: 200
  # 停止整个内核时等待 Session 排空的时间。
  shutdown-session-drain-timeout-ms: 5000
  # 禁用 Ability 前等待其 Session 自然排空的时间。
  ability-drain-timeout-ms: 5000
  # 请求取消后额外等待的宽限时间。
  cancel-grace-timeout-ms: 5000
  # 单次 ResourceLifecycle 操作的最长等待时间。
  resource-lifecycle-timeout-ms: 120000

# 启动时选中的全局 AbilityProfile 名称。空列表表示不产生 Profile claim。
ability-profiles: []

# App 串行调谐与失败重试周期。
reconciliation:
  enabled: true
  interval-ms: 1000

state-store:
  busy-timeout-ms: 5000

logging:
  level: info
  console-enabled: true
  file-enabled: true

i18n:
  preferred-locale: en_US

# 可通过 ${global#path} 读取的全局上下文初始值。
global-context: {}
